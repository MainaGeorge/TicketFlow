services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      OpenTelemetry__OtlpEndpoint: "http://jaeger:4317"
      Redis__ConnectionString: "redis:6379"
      ConnectionStrings__DefaultConnection: "Server=sql,1433;Database=TicketFlow;User Id=sa;Password=TicketFlow!Dev2026;TrustServerCertificate=True;"
      RabbitMq__Host: "rabbitmq"
      Admin__Email: "${TICKETFLOW_ADMIN_EMAIL}"
      Admin__Password: "${TICKETFLOW_ADMIN_PASSWORD}"

    depends_on:
      sql:
        condition: service_healthy

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TicketFlow!Dev2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - ticketflow-sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TicketFlow!Dev2026' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:management
    environment:
      RABBITMQ_DEFAULT_USER: ticketflow
      RABBITMQ_DEFAULT_PASS: TicketFlowRabbit2026
    ports:
      - "5672:5672"
      - "15672:15672"

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
volumes:
  ticketflow-sql-data:
